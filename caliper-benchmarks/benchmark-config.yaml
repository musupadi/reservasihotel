test:
  name: hotel-reservation-benchmark
  description: Benchmark test for hotel reservation system
  workers:
    number: 5
  rounds:
    # Round 1: Create Reservations (Write Performance)
    - label: create-reservation
      description: Create new hotel reservations
      txNumber: 100
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workload/create-reservation.js
        arguments:
          hotelID: "HTL001"
          roomTypeID: "ROOM001"

    # Round 2: Query Single Reservation (Read Performance)
    - label: query-reservation
      description: Query existing reservation by ID
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workload/query-reservation.js

    # Round 3: Query All Reservations (Complex Read)
    - label: query-all-reservations
      description: Query all reservations
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: workload/query-all.js

    # Round 4: Update Reservation Status (Update Performance)
    - label: update-reservation
      description: Update reservation status
      txNumber: 100
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workload/update-reservation.js
        arguments:
          newStatus: "confirmed"

    # Round 5: Mixed Workload (Real-world scenario)
    - label: mixed-workload
      description: Mixed create/read/update operations
      txNumber: 150
      rateControl:
        type: fixed-rate
        opts:
          tps: 15
      workload:
        module: workload/mixed-workload.js

    # Round 6: Stress Test (High Load)
    - label: stress-test
      description: Stress test with high transaction rate
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/create-reservation.js
        arguments:
          hotelID: "HTL001"
          roomTypeID: "ROOM001"

monitors:
  resource:
    - module: docker
      options:
        interval: 5
        containers:
          - peer0.org1.example.com
          - peer0.org2.example.com
          - orderer.example.com
          - couchdb0
          - couchdb1
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          include: [peer*, orderer*, couch*]
