Organizations:
    - &OrdererOrg
        Name: OrdererOrg
        ID: OrdererMSP
        MSPDir: organizations/ordererOrganizations/reservation.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('OrdererMSP.member')"
            Writers:
                Type: Signature
                Rule: "OR('OrdererMSP.member')"
            Admins:
                Type: Signature
                Rule: "OR('OrdererMSP.admin')"

    - &HotelOrg
        Name: HotelOrgMSP
        ID: HotelOrgMSP
        MSPDir: organizations/peerOrganizations/hotelorg.reservation.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('HotelOrgMSP.admin', 'HotelOrgMSP.peer', 'HotelOrgMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('HotelOrgMSP.admin', 'HotelOrgMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('HotelOrgMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('HotelOrgMSP.peer')"
        AnchorPeers:
            - Host: peer0.hotelorg.reservation.com
              Port: 7051

    - &GuestOrg
        Name: GuestOrgMSP
        ID: GuestOrgMSP
        MSPDir: organizations/peerOrganizations/guestorg.reservation.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('GuestOrgMSP.admin', 'GuestOrgMSP.peer', 'GuestOrgMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('GuestOrgMSP.admin', 'GuestOrgMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('GuestOrgMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('GuestOrgMSP.peer')"
        AnchorPeers:
            - Host: peer0.guestorg.reservation.com
              Port: 8051

Capabilities:
    Channel: &ChannelCapabilities
        V2_0: true
    Orderer: &OrdererCapabilities
        V2_0: true
    Application: &ApplicationCapabilities
        V2_0: true

Application: &ApplicationDefaults
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        LifecycleEndorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
        Endorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
    Capabilities:
        <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
    OrdererType: etcdraft
    Addresses:
        - orderer.reservation.com:7050
    EtcdRaft:
        Consenters:
        - Host: orderer.reservation.com
          Port: 7050
          ClientTLSCert: organizations/ordererOrganizations/reservation.com/orderers/orderer.reservation.com/tls/server.crt
          ServerTLSCert: organizations/ordererOrganizations/reservation.com/orderers/orderer.reservation.com/tls/server.crt
    BatchTimeout: 2s
    BatchSize:
        MaxMessageCount: 10
        AbsoluteMaxBytes: 99 MB
        PreferredMaxBytes: 512 KB
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        BlockValidation:
            Type: ImplicitMeta
            Rule: "ANY Writers"

Channel: &ChannelDefaults
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
    Capabilities:
        <<: *ChannelCapabilities

Profiles:
    TwoOrgsApplicationGenesis:
        <<: *ChannelDefaults
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *OrdererOrg
            Capabilities: *OrdererCapabilities
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *HotelOrg
                - *GuestOrg
            Capabilities: *ApplicationCapabilities
